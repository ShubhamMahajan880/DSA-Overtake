spring.application.name=Day99_114-invoice-service-adding-config-server
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/18lpa_preparation
spring.datasource.username=root
spring.datasource.password=Java@18LPA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.auto-commit=false



spring.data.redis.host=advanced-sunbird-200218.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=gQAAAAAAAw4aAAIgcDIzMzgxYjhhNjQzYTQ0NTA4OTAwMzkzN2IwZmE5YzM0ZA
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers

# Show detailed health information
management.endpoint.health.show-details=always

# Actuator base path
management.endpoints.web.base-path=/actuator

# Adding for Eureka Server 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.cloud.openfeign.micrometer.enabled=true
spring.cloud.openfeign.micrometer.enabled-for-proxies=true



spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

resilience4j.circuitbreaker.instances.categoryService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.categoryService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.categoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.categoryService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.categoryService.permittedNumberOfCallsInHalfOpenState=2